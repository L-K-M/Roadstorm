; Roadstorm Racer! - native export presets (PLAN.md M0.4/M0.5, M9.1).
;
; Ownership: export_presets.cfg. See PLAN.md "How agents execute the plan".
;
; These are minimal, HONEST PLACEHOLDER presets for the three committed
; desktop targets in docs/TECHNICAL_DESIGN.md ("Packaging and operations"):
;   * macOS on Apple Silicon
;   * Windows x86-64
;   * Linux x86-64
;
; What this file is NOT:
;   * It is not a verified release package. PLAN.md M9.2 and M0 acceptance both
;     require launching the package on its target OS before any supported-
;     platform claim. This host can only launch the macOS package; Windows and
;     Linux builds are cross-exports whose packages are NOT launched here.
;   * It is not signed or notarized. No Developer ID / notarization credentials
;     exist for this project, so the macOS preset uses Godot's built-in AD-HOC
;     signing. The resulting package is ad-hoc signed and UNNOTARIZED and must
;     be labelled that way (PLAN.md M9.3).
;   * The macOS package is UNIVERSAL, because the pinned official Godot 4.7.2
;     macOS template ships only a universal binary (no arm64-only template).
;     The arm64 slice runs natively on Apple Silicon and is the slice launched
;     here; the x86_64 (Intel) slice is UNTESTED and Intel Mac support is NOT
;     claimed (docs/TECHNICAL_DESIGN.md adds a universal Mac package only with
;     Intel testing).
;
; Icons, a real bundle identifier, version/build identifiers, full notices and
; offline license screens are M9 work. The identifier below is a placeholder
; reverse-DNS value, not a registered/owned domain.
;
; EXCLUDE FILTER (Opus recheck 4803d848 finding E4)
; ------------------------------------------------
; export_filter="all_resources" packs every resource Godot recognises under
; res://, so without an exclude filter the packages shipped development-only
; tooling: tools/** (CI, smoke, probes, validators, evidence), fixtures/**
; (test fixtures), schemas/** (contract schemas), docs/**, plan/**, review/**,
; work/**, .github/**, tests/**, stray *.py/*.sh scripts and the asset registry
; assets/manifest.json.
;
; RUNTIME DEPENDENCIES ARE NOT EXCLUDED. scenes/, src/, assets/ (art, audio and
; other shipped content), project.godot and the bundle metadata stay in the
; package. Only assets/manifest.json is excluded from assets/: it is the asset
; registry maintained by tools/asset_manifest (a Python tool), and no script or
; scene under src/ or scenes/ reads it. licenses/ and provenance/ are also left
; alone: they hold the Unlicense, CC0 and engine/dependency notices that M9
; packaging must ship (Godot packs only recognised resource types, so they are
; not in the pack today - see tools/export_smoke/lib/pack_inventory.py).
;
; Patterns are matched against the res://-relative path, and "*" crosses "/"
; (fnmatch semantics), so "tools/*" covers tools/ci/scripts/*.gd.
; tools/export_smoke/lib/pack_inventory.py check re-reads the res:// tree inside
; every produced .pck and FAILS the run if any of these paths reappears or if a
; required runtime resource disappears, so this filter is verified, not assumed.

[preset.0]

name="macOS Apple Silicon"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*,fixtures/*,schemas/*,docs/*,plan/*,review/*,work/*,.github/*,tests/*,*.py,*.sh,assets/manifest.json"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
; Architecture is "universal" because the PINNED OFFICIAL Godot 4.7.2 macOS
; export template (macos.zip) ships ONLY a universal binary
; (godot_macos_release.universal = x86_64 + arm64); it ships no arm64-only
; template, so binary_format/architecture="arm64" fails with
; "Requested template binary godot_macos_release.arm64 not found". The arm64
; slice runs NATIVELY on Apple Silicon and is the slice launched in the M0
; smoke test on this host. The x86_64 (Intel) slice is UNTESTED - no Intel Mac
; is available - and Intel Mac support is therefore NOT claimed.
; docs/TECHNICAL_DESIGN.md adds a universal Mac package only with Intel
; testing, so this is an M0 smoke build, not a verified platform package.
binary_format/architecture="universal"
application/bundle_identifier="dev.roadstorm.placeholder"
application/short_version="0.0.0-placeholder"
application/version="0.0.0-placeholder"
application/copyright="Original project code under the Unlicense; original art/audio under CC0."
application/min_macos_version="14.0"
application/export_method_release="release"
application/code_sign_identity_release=""
application/export_angle=false
display/high_res=true
codesign/codesign=3
codesign/certificate_file=""
codesign/certificate_password=""
codesign/entitlements/custom_file=""
notarization/notarization=0
notarization/apple_id_name=""
notarization/apple_id_password=""
notarization/api_uuid=""
notarization/api_key=""
notarization/api_key_id=""
rendering/method="gl_compatibility"
rendering/anti_aliasing_quality=0

