# Roadstorm Racer! continuous integration.
#
# PLAN.md M0.5: "Add CI for resource/script checks, tests, asset validation, and
# native export preparation. CI must run from a clean checkout without editor
# interactions or generation-service accounts."
#
# Everything runs through tools/ci/ci.sh, which is the same entry point a
# developer or an independent reviewer uses (plan/IMPLEMENTATION.md requires
# reviewers to run checks in isolated source snapshots with isolated caches;
# ci.sh always works on a scratch copy and never touches a shared .godot/).
#
# The pinned engine is Godot 4.7.2.stable (PLAN.md M0.1). CI either uses a
# GODOT_BIN provided by the runner (a self-hosted runner with the pinned editor
# installed) or downloads the official release asset for the pinned tag and
# VERIFIES IT AGAINST THE PUBLISHER'S CHECKSUM BEFORE EXTRACTION. M0.1 requires
# "checksums. Verify before installation": a runner that downloads an archive and
# runs whatever came out of it has not done that, so the download path below
# fails the step before `unzip` and again before the binary is executed.
#
# The pinned version, the official URL and the pinned digests all live in
# tools/ci/pin/engine.txt (read with `ci.sh pin`), so there is one record rather
# than a second copy of the numbers in this file. The version authority is the
# official archive at https://godotengine.org/download/archive/.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: import, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bounded by design: a stalled transfer fails the step instead of holding
      # the runner, and the archive is hashed before anything is unpacked.
      - name: Resolve and verify the pinned Godot editor
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          source_desc="runner GODOT_BIN"
          if [ -n "${GODOT_BIN:-}" ] && [ -x "${GODOT_BIN:-}" ]; then
            echo "Using GODOT_BIN from the runner environment."
            bin="$GODOT_BIN"
          else
            echo "Downloading the official release asset for the pinned tag."
            url="$(tools/ci/ci.sh pin --field release_archive_url)"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fsSL --retry 3 --retry-delay 2 \
              --connect-timeout 30 --max-time 1800 \
              -o "$archive" "$url"
            echo "downloaded $(wc -c <"$archive" | tr -d ' ') bytes from $url"

            # PLAN.md M0.1: verify before installation. This compares the
            # archive against the publisher's pinned digest and exits nonzero on
            # a mismatch, so a tampered, truncated or substituted archive never
            # reaches `unzip`.
            tools/ci/ci.sh verify-engine --archive "$archive"

            mkdir -p "$RUNNER_TEMP/godot"
            unzip -q "$archive" -d "$RUNNER_TEMP/godot"
            bin="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot*' -perm -u+x | head -n 1)"
            if [ -z "$bin" ] || [ ! -x "$bin" ]; then
              echo "::error::the extracted archive contained no executable Godot binary"
              exit 1
            fi
            chmod +x "$bin"

            # Second, cheap check: the extracted binary is the one the pin
            # recorded, before anything executes it.
            tools/ci/ci.sh verify-engine --binary "$bin"
            source_desc="official release asset, digest-verified before extraction and execution"
          fi
          engine_version="$("$bin" --version 2>/dev/null || echo unavailable)"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "Engine reports: $engine_version"
          {
            echo "### Pinned engine"
            echo ""
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| pinned tag | $(tools/ci/ci.sh pin --field tag) |"
            echo "| pinned version | $(tools/ci/ci.sh pin --field version) |"
            echo "| source | $source_desc |"
            echo "| resolved binary | $bin |"
            echo "| sha256 | $(sha256sum "$bin" | awk '{print $1}') |"
            echo "| --version | $engine_version |"
            echo ""
            echo "A downloaded archive was compared against the pinned publisher"
            echo "digest in \`tools/ci/pin/engine.txt\` BEFORE extraction, and the"
            echo "extracted binary before execution (PLAN.md M0.1). Reproduce locally"
            echo "with \`tools/ci/ci.sh verify-engine --archive <file> --binary <file>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Doctor - environment and engine pin
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" doctor

      - name: Import - headless resource import (T01)
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" import

      - name: Validate - pin, settings, resource/script scan (T01)
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" validate

      # M0.4 plus Opus recheck finding N1: the deliberately failing probe must
      # exit nonzero, and every discovered check is judged on its exit status AND
      # on its captured engine log, so a runtime error in a boot script (a
      # missing dictionary key, push_error(), ...) fails here exactly as the
      # supported wrapper tools/smoke/run_boot_smoke.sh fails, instead of being
      # reported as "(informational)".
      - name: Test - headless checks, exit-code proof and engine-error gate (M0.4)
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" test

      # Regression proof for that gate (N1), and for the warning handling behind
      # R7'. It runs the same engine against throwaway snapshot copies in a
      # private temporary directory, injects the defects there, and checks the
      # ACTUAL exit status of `ci.sh test` each time. It is bounded twice over
      # (per engine invocation and per case) and touches nothing in the checkout.
      - name: Runtime-error gate regression (N1/R7)
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          tools/ci/scripts/runtime_error_gate.sh

      # Warning watch. Every WARNING line the checks printed is written to the
      # run summary -- printed, never filtered -- and a warning matching one of
      # the five known Jolt physics warning shapes fails the job: every one
      # means contacts were ignored or a slower allocator was used, so a run that
      # printed one must not be reported as a clean pass (the open R7 item is the
      # job-system one). Other warnings are reported, not fatal -- including a
      # warning that merely mentions "jolt" without being one of those shapes,
      # such as the nested-project path res://tools/jolt_inventory. The ones the
      # project has accepted live in tools/ci/warnings.allow and are labelled as
      # accepted.
      #
      # `if: always()` (Sol recheck finding 5, Opus recheck W1): the step used to
      # run under the default success condition, so the Test step that failed on
      # a Jolt warning skipped the very summary meant to surface it.
      #
      # The policy itself lives in tools/ci/scripts/warning_watch.sh, on top of
      # the same classification code `ci.sh` uses, so the workflow and the
      # tooling cannot disagree about which warnings are fatal (Opus recheck
      # W2/W3).
      - name: Warning watch - surface engine warnings, fail on physics ones (R7)
        if: always()
        shell: bash
        run: tools/ci/scripts/warning_watch.sh tools/ci/out/logs

      # Asset validation (PLAN.md M0.5). The validator is owned by
      # tools/asset_manifest/**; CI runs it when it is present and fails
      # clearly when it is not, because a missing validator is a gap in the
      # check set rather than a pass. Its exit code propagates: the wrapper
      # exits 1 on validation errors and 2 when the manifest cannot be read.
      - name: Asset manifest validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/asset_manifest/validate_manifest.py ]; then
            python3 tools/asset_manifest/validate_manifest.py
          else
            echo "::error::tools/asset_manifest/validate_manifest.py is missing, so asset validation (T15) did not run. This is a missing check, not a pass."
            exit 1
          fi

      # Report only: a GitHub-hosted runner has no display, so movie capture
      # cannot run there. The check records that limitation instead of claiming
      # a capture it did not perform. It also records the project's viewport
      # size, because a capture records the viewport size rather than the
      # window size requested with --resolution.
      - name: Capture readiness (report only)
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" capture --check

      - name: Upload CI logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: tools/ci/out/
          if-no-files-found: warn
          retention-days: 14

  # Not implemented yet: content validation (T09/T15) has no validator, so this
  # job only reports which planned content paths exist. It is non-blocking on
  # purpose and is labelled as such; it must not be read as content validation.
  content-contracts:
    name: content-contract inventory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inventory planned content paths
        run: |
          {
            echo "### Content-contract inventory"
            echo ""
            echo "Non-blocking inventory of the paths PLAN.md requires. Absence is"
            echo "reported, never validated: content validation (T09/T15) is not"
            echo "implemented. Enforce the gate locally with \`ci.sh validate"
            echo "--strict-contracts\` once the paths are expected to exist."
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tools/ci/ci.sh validate --strict-contracts 2>&1 |
            grep -E '^\[ci:(ok|warn|fail)\] (present|absent)' |
            sed 's/^/ /' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Native export preparation (M0.5).
  #
  # No job-level condition. The condition this job used to carry,
  # `if: hashFiles('export_presets.cfg') != ''`, is INVALID: `hashFiles` is a
  # step-level function and actionlint rejects it in a job `if`, which made the
  # whole committed workflow -- including the checks above -- fail validation
  # (Sol recheck finding 1). export_presets.cfg is committed now, so the job
  # always runs; if the presets are ever removed again, `ci.sh export --check`
  # fails the job with an explicit message instead. A skipped job would be a
  # silent green, which is exactly what this workflow must not produce.
  export-preparation:
    name: export preparation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify the pinned Godot editor
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GODOT_BIN:-}" ] && [ -x "${GODOT_BIN:-}" ]; then
            bin="$GODOT_BIN"
          else
            url="$(tools/ci/ci.sh pin --field release_archive_url)"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fsSL --retry 3 --retry-delay 2 \
              --connect-timeout 30 --max-time 1800 \
              -o "$archive" "$url"
            # M0.1: verify before extraction.
            tools/ci/ci.sh verify-engine --archive "$archive"
            mkdir -p "$RUNNER_TEMP/godot"
            unzip -q "$archive" -d "$RUNNER_TEMP/godot"
            bin="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot*' -perm -u+x | head -n 1)"
            if [ -z "$bin" ] || [ ! -x "$bin" ]; then
              echo "::error::the extracted archive contained no executable Godot binary"
              exit 1
            fi
            chmod +x "$bin"
            # Verify before execution.
            tools/ci/ci.sh verify-engine --binary "$bin"
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # Export templates (Opus recheck finding E1). The job used to install no
      # templates at all, so `export --check` failed on a fresh runner for all
      # three targets -- and the obvious workaround, GODOT_TEMPLATES_DIR, would
      # have turned that red check green while the engine still refused to
      # export, because the engine reads templates from its OWN user-data
      # directory and does not read that variable (measured against the pinned
      # engine; see ci_templates_engine_dir in tools/ci/lib/common.sh).
      #
      # So: download the pinned template archive, verify it against the
      # publisher's SHA-512 BEFORE extraction (M0.1: "Verify before
      # installation"), install it exactly where the engine looks on GitHub
      # Linux (~/.local/share/godot/export_templates/<version>.stable), then
      # verify the installed tree -- version.txt plus the templates this
      # project's presets require, each non-empty.
      #
      # The official Godot release packages templates/* at the archive root
      # (godot-build-scripts build-release.sh), NOT a <version>.stable
      # directory, so the installer locates the payload by its version.txt,
      # validates that version before placing anything, and refuses a staged
      # tree that does not satisfy the project's presets. It also REFUSES to
      # replace an existing ~/.local/share/godot/export_templates/<version>
      # directory rather than deleting an installed tree (a fresh hosted runner
      # has none; remove it explicitly on a persistent host). (Coordinator
      # follow-up.)
      - name: Resolve and verify the pinned export templates
        id: templates
        shell: bash
        run: |
          set -euo pipefail
          tver="$(tools/ci/ci.sh pin --field version).stable"
          url="$(tools/ci/ci.sh pin --field templates_url)"
          archive="$RUNNER_TEMP/godot-export-templates.tpz"
          curl -fsSL --retry 3 --retry-delay 2 \
            --connect-timeout 30 --max-time 1800 \
            -o "$archive" "$url"
          echo "downloaded $(wc -c <"$archive" | tr -d ' ') bytes from $url"

          # M0.1: verify before installation. A tampered, truncated or
          # substituted archive never reaches `unzip`.
          tools/ci/ci.sh verify-templates --archive "$archive"

          # Install where the engine reads templates. Re-verifies the archive
          # digest before extracting it, then installs the verified payload.
          dest="${HOME}/.local/share/godot/export_templates"
          tools/ci/ci.sh install-templates --archive "$archive" --dest "$dest" --mode release

          # The installed tree is what the engine will read: its version and the
          # templates this project's presets require, all non-empty.
          tools/ci/ci.sh verify-templates --dir "$dest" --mode release

          {
            echo "### Pinned export templates"
            echo ""
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| pinned tag | $(tools/ci/ci.sh pin --field tag) |"
            echo "| archive url | $url |"
            echo "| archive sha512 | $(tools/ci/ci.sh pin --field templates_archive_sha512) |"
            echo "| installed at | $dest/$tver |"
            echo "| templates | $(find "$dest/$tver" -maxdepth 1 -type f | wc -l | tr -d ' ') file(s) |"
            echo ""
            echo "The archive was compared against the pinned publisher digest in"
            echo "\`tools/ci/pin/engine.txt\` BEFORE extraction (PLAN.md M0.1), and the"
            echo "installed tree was verified afterwards. Reproduce locally with"
            echo "\`ci.sh install-templates --archive <file> --dest <engine export_templates dir>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export preparation check (templates and presets)
        run: tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" export --check

      # The tooling self-test's template-dependent failure-path cases need the
      # templates this job just installed and verified. Run them here so hosted
      # CI actually exercises stale-output refusal, corrupted-package rejection,
      # concurrent-destination serialization and attempt-bound inventory
      # naming. The step FAILS if any of those required cases would skip.
      - name: Tooling self-test with verified templates (failure-path coverage)
        shell: bash
        env:
          GODOT_BIN: ${{ steps.godot.outputs.bin }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ci-tooling-selftest.log"
          if ! sh tools/ci/tests/run_tests.sh >"$log" 2>&1; then
            cat "$log"
            echo "::error::tools/ci self-test failed"
            exit 1
          fi
          grep -q '^\[ci-selftest\] PASS' "$log"
          if grep -qF 'the pinned export templates are not installed on this host' "$log"; then
            cat "$log"
            echo "::error::template-dependent export cases were skipped: no pinned templates found"
            exit 1
          fi
          if grep -qF 'no installed Godot matches pin' "$log"; then
            cat "$log"
            echo "::error::engine-backed export cases were skipped: editor does not match the pin"
            exit 1
          fi
          for _needle in \
            "an existing main+sidecar target is refused and left byte-identical -> yes" \
            "a pre-existing sidecar alone is refused, not treated as the package -> yes" \
            "a dangling symlink target is refused and never written through -> yes" \
            "a corrupted package exits nonzero, prints no PASS and names the inventory failure -> yes" \
            "the rejected export report carries one fail verdict and no pass verdict -> yes" \
            "the failed attempt owns no PASS inventory; prior PASS history stays separate -> yes" \
            "the inventory failure reason is preserved in the uploaded logs -> yes" \
            "the inventory report carries the source SHA and the same attempt id -> yes" \
            "the overlapping invocation waits instead of claiming the destination -> yes" \
            "the zero-write attempt fails and the blocked attempt delivers the package -> yes" \
            "the successful concurrent attempt's report matches the delivered digests -> yes" \
            "failed attempt leaves no PASS; persistent lock files remain -> yes" \
            "stale persistent lock files do not block a later export -> yes" \
            "two nonoverlapping concurrent exports both succeed -> yes" \
            "a foreign lock FILE is preserved and a live owner blocks others -> yes" \
            "a symlink lock path is refused and left intact -> yes" \
            "a non-regular lock path is refused and preserved -> yes" \
            "foreign bytes appended to a live lock file are preserved -> yes" \
            "a lock path replaced with a symlink during export is preserved -> yes" \
            "SIGTERM releases the advisory lock and leaves no package -> yes" \
            "stale persistent lock files are inert after SIGTERM -> yes"
          do
            if ! grep -qF -- "$_needle" "$log"; then
              echo "::error::required export failure-path case did not pass: $_needle"
              cat "$log"
              exit 1
            fi
          done
          tail -n 8 "$log"

      # A locally produced package is not a verified release: PLAN.md M9.2 still
      # requires launching each package on its target OS, and M9.3 covers
      # signing/notarization.
      - name: Build each declared preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" export --list-presets |
            while IFS=$'\t' read -r _section name platform; do
              # The platform column is the value Godot writes in
              # export_presets.cfg, so the Windows target is "Windows
              # Desktop", not "Windows" -- the same mapping
              # `ci.sh export --check` applies through
              # ci_preset_platform_for (tools/ci/lib/common.sh). Matching the
              # requirement name here would build the Windows preset with a
              # .pck extension. (_section is the preset index and is unused
              # here; it is named with a leading underscore so linters do not
              # report it.)
              case "$platform" in
                macOS) ext="zip" ;;
                "Windows Desktop") ext="exe" ;;
                Linux) ext="" ;;
                *) ext="pck" ;;
              esac
              out="build/${name}${ext:+.$ext}"
              echo "Exporting preset '${name}' (${platform}) to ${out}"
              tools/ci/ci.sh --godot "${{ steps.godot.outputs.bin }}" --source-sha "${{ github.sha }}" export --export "$name" --out "$out"
            done

      # Export failures are only actionable with the engine log. Godot's export
      # configuration errors are multi-line and indented, so a filtered view of
      # anchored ERROR lines alone hid the reason; ci.sh now prints the full
      # captured log, and this upload preserves it when the job is read later.
      # Only logs/ and reports/ are uploaded: tools/ci/out/project-copy/ is a
      # scratch copy of the project, not evidence. Reports include the
      # per-preset pack-inventory report written by ci.sh export; its filename
      # carries the source SHA passed to the export job.
      - name: Upload export logs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-logs
          path: |
            tools/ci/out/logs/
            tools/ci/out/reports/
          if-no-files-found: warn
          retention-days: 14

      # The build step reports the main file AND the sidecar .pck (which carries
      # the project data; on Linux the main binary is the pinned stock template).
      # Upload only when every prior step succeeded: a failed or inventory-
      # rejected export must never publish its files as a successful package
      # set. Failure evidence still uploads through the always() export-logs
      # step above (Sol recheck 8c6c928). `success()` also covers a failure in
      # an earlier preset, so partial builds are not presented as complete.
      - name: Upload built packages
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-packages
          path: build/
          if-no-files-found: warn
          retention-days: 14

  # Contract suites (M0.5: tests must run from the checked-out candidate).
  # These are standard-library Python/shell suites over schemas/, fixtures/
  # and tools/python_pin. This is deliberately a separate headless job: it
  # needs no Godot editor, no templates and no generation-service accounts,
  # and it does not touch them. A missing or failing suite fails the job
  # explicitly rather than being skipped silently.
  contract-suites:
    name: contract suites (standard library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both interpreters are required by the suites. Fail with an annotation
      # instead of letting a suite exit 2 ambiguously.
      - name: Verify suite prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v bash >/dev/null 2>&1 || { echo "::error::bash is unavailable"; exit 1; }
          command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is unavailable"; exit 1; }
          {
            echo "### Contract suite interpreters"
            echo ""
            echo "- bash: $(bash --version | head -n 1)"
            echo "- python: $(python3 --version 2>&1)"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Run contract suites on the exact checkout
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail

          # Private temp/cache/config/data roots: the suites never write into
          # the checkout, shared home, templates or another job's files.
          _root="$RUNNER_TEMP/contract-suites"
          mkdir -p "$_root/tmp" "$_root/cache" "$_root/home/.config" "$_root/home/.local/share"
          export TMPDIR="$_root/tmp"
          export HOME="$_root/home"
          export XDG_CACHE_HOME="$_root/cache"
          export XDG_CONFIG_HOME="$_root/home/.config"
          export XDG_DATA_HOME="$_root/home/.local/share"

          _summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Contract suites"
            echo ""
          } >>"$_summary"

          failed=0
          for _suite in \
            schemas/handling/run_tests.sh \
            fixtures/observation/run_tests.sh \
            fixtures/intent/run_tests.sh \
            fixtures/scenario/run_tests.sh \
            tools/python_pin/tests/test_verify.sh
          do
            echo "=== contract suite: $_suite ==="
            if [ ! -f "$_suite" ]; then
              echo "::error::required contract suite is missing: $_suite"
              printf -- '- FAIL %s (missing)\n' "$_suite" >>"$_summary"
              failed=1
              continue
            fi
            if bash "$_suite"; then
              printf -- '- PASS %s\n' "$_suite" >>"$_summary"
            else
              _rc=$?
              echo "::error::contract suite FAILED: $_suite (exit $_rc)"
              printf -- '- FAIL %s (exit %s)\n' "$_suite" "$_rc" >>"$_summary"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more contract suites were missing or failed"
            exit 1
          fi
          echo "All contract suites passed."
